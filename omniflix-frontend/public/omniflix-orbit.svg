<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">OmniFlix Orbit logo</title>
  <desc id="desc">A white and violet yin-yang-inspired planet surrounded by a two-tone orbital ring, beside the OmniFlix wordmark.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7B5FF"/>
      <stop offset=".52" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D9E3"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="88" cy="90" r="45"/></clipPath>
  </defs>
  <!-- Yin-yang-inspired planet -->
  <circle cx="88" cy="90" r="49" fill="none" stroke="#24202F" stroke-width="2"/>
  <g clip-path="url(#planetClip)">
    <rect x="43" y="45" width="90" height="90" fill="url(#white)"/>
    <path d="M88 45 A22.5 22.5 0 0 1 88 90 A22.5 22.5 0 0 0 88 135 Z" fill="url(#violet)"/>
    <path d="M88 45 A22.5 22.5 0 0 0 88 90 A22.5 22.5 0 0 1 88 135 Z" fill="#F9F8FC"/>
    <circle cx="88" cy="67.5" r="7" fill="url(#violet)"/>
    <circle cx="88" cy="112.5" r="7" fill="#F9F8FC"/>
    <path d="M43 90 H133" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
  <!-- Orbit split into white and violet halves -->
  <ellipse cx="88" cy="90" rx="76" ry="25" transform="rotate(-25 88 90)" fill="none" stroke="url(#white)" stroke-width="7" stroke-dasharray="118 120" stroke-linecap="round"/>
  <ellipse cx="88" cy="90" rx="76" ry="25" transform="rotate(-25 88 90)" fill="none" stroke="url(#violet)" stroke-width="7" stroke-dasharray="120 118" stroke-dashoffset="-118" stroke-linecap="round"/>
  <circle cx="147" cy="51" r="5.5" fill="url(#violet)"/>
  <!-- Wordmark -->
  <text x="190" y="109" font-family="Inter, Montserrat, Arial, sans-serif" font-size="55" font-weight="750" letter-spacing="-2.1" fill="#F7F7FA">Omni</text>
  <text x="316" y="109" font-family="Inter, Montserrat, Arial, sans-serif" font-size="55" font-weight="750" letter-spacing="-2.1" fill="url(#violet)">Flix</text>
</svg>
